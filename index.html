<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GridMeasure — Calibrate images using grid coordinates and measure distances between points. Client-side image measurement tool." />
  <title>GridMeasure — Image Measurement Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===== Header ===== -->
  <header id="app-header">
    <div class="header-brand">
      <h1>GridMeasure</h1>
      <p class="header-tagline">Calibrate images using grid coordinates and measure distances between points.</p>
    </div>
  </header>

  <!-- ===== Main Layout ===== -->
  <main id="app-main">
    <!-- Left Sidebar: Image Management -->
    <aside id="left-sidebar">
      <div class="sidebar-section">
        <button id="add-images-btn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Add Images
        </button>
        <input type="file" id="file-input" multiple accept="image/png,image/jpeg,image/webp,image/tiff" hidden />
      </div>
      <div id="image-list" class="image-list"></div>
    </aside>

    <!-- Central Workspace -->
    <section id="workspace">
      <div id="canvas-wrapper">
        <canvas id="main-canvas"></canvas>
        <div id="magnifier" class="magnifier">
          <canvas id="magnifier-canvas"></canvas>
        </div>
      </div>
    </section>

    <!-- Right Sidebar: Point Manager -->
    <aside id="right-sidebar">
      <div class="sidebar-section">
        <div id="status-message" class="status-message">Load an image to begin</div>
      </div>

      <div class="sidebar-section point-list-section">
        <h2 class="sidebar-heading">Points</h2>
        <div id="point-list" class="point-list"></div>
      </div>

      <div class="sidebar-section">
        <div class="point-actions">
          <button id="delete-last-btn" class="btn btn-danger btn-sm" style="display:none">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Delete Last
          </button>
          <button id="reset-points-btn" class="btn btn-outline btn-sm" style="display:none">Reset Points</button>
        </div>
      </div>

      <div class="sidebar-section">
        <div id="calibration-diagnostics" class="calibration-diagnostics"></div>
      </div>

      <div class="sidebar-section">
        <h2 class="sidebar-heading">Calibration</h2>
        <div class="unit-input-row">
          <label for="grid-unit-size">Grid unit size:</label>
          <input type="number" id="grid-unit-size" min="0" step="any" placeholder="e.g. 10" />
          <span class="unit-label">mm</span>
        </div>
      </div>

      <div class="sidebar-section export-section">
        <h2 class="sidebar-heading">Export</h2>
        <button id="export-new-csv" class="btn btn-export">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v9M3 6l4 4 4-4M1 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Export CSV
        </button>
        <button id="export-append-csv" class="btn btn-export-append">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v9M3 6l4 4 4-4M1 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Append to CSV
        </button>
        <input type="file" id="append-file-input" accept=".csv" hidden />
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
